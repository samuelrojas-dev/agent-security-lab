name: supabase-keepalive

# Supabase pauses free projects after a week without activity. A tiny read every three days
# keeps the lab's database awake for live runs (`pytest -m live`, live-attacks.yml).
# It reads products_public with the anon key: public data only, nothing is written.

on:
  schedule:
    - cron: "17 13 */3 * *"   # every 3 days, 08:17 Bogotá
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Read one public row
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "Supabase secrets not set; nothing to keep awake."
            exit 0
          fi
          curl -sSf --max-time 30 "$SUPABASE_URL/rest/v1/products_public?select=id&limit=1" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY" > /dev/null
          echo "Supabase answered."
