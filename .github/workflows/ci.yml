name: offline-tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt
      - run: pytest -m "not live" -q
      # Architecture gate, run through this repo's own action so every push also tests the
      # action: a model that obeys every injected instruction must still not be able to get
      # internal data out of the structural designs. No API keys needed.
      - name: Worst-case gate (compromised model, mutated attack suite)
        uses: ./
        with:
          gate: hardened agent_least_privilege
          artifact-name: worst-case-report
